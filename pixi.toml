[workspace]
authors = ["Joshua Siraj <joshua.siraj@ryerson.ca>"]
channels = ["conda-forge"]
name = "med-datactrl"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
benchmark = "python -m benchmark.run_llm"

[dependencies]
python = ">=3.11,<3.14"

[pypi-dependencies]
med-datactrl = { path = ".", editable = true }
litellm = ">=1.0.0"
openslide-python = ">=1.4.6, <2"
pypdf = ">=6.0.0, <7"
