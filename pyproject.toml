[project]
name = "med-datactrl"
version = "0.2.0"
description = "Local medical data access harness for DICOM, structured data, and notes"
authors = [{ name = "Joshua Siraj", email = "joshuasiraj@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.13.4,<3",
    "med-imagetools>=2.15.0,<3",
    "pypdf>=6.0.0,<7",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/datactrl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["datactrl"]
exclude = ["\\.pixi/"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
extend = "configs/ruff.toml"
